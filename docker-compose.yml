services:
  db:
    image: pgvector/pgvector:pg16
    container_name: regagent-postgres
    environment:
      POSTGRES_DB: regagent
      POSTGRES_USER: regagent
      POSTGRES_PASSWORD: regagent
    ports:
      - "5432:5432"
    volumes:
      - regagent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regagent -d regagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  regagent-postgres-data:

