    <main>
      <h1>Сынақ нормативтік актісі</h1>
      <p>1-бөлім. Жалпы ережелер</p>
      <p>1-тарау. Негізгі ұғымдар</p>
      <p>1-бап. Реттеу нысанасы</p>
      <p>1. Осы акт нормативтік құжаттарды өңдеу тәртібін айқындайды.</p>
      <p>1) нәтиже ресми дереккөзге сілтеме жасауға тиіс;</p>
      <p>2-бап. Нәтижелерді тексеру</p>
      <p>1. Талдау нәтижесі пайдаланылғанға дейін тексеріледі.</p>
