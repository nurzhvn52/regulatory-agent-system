[tool.poetry]
name = "regulatory-agent-system"
version = "0.1.0"
description = "Research platform for generating evidence-grounded agents that analyse regulatory documents"
authors = ["Nurzhan Serikbekov"]
readme = "README.md"
packages = [{ include = "regagent", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
pydantic = ">=2.9,<3.0"
pydantic-settings = ">=2.5,<3.0"
sqlalchemy = ">=2.0,<3.0"
alembic = ">=1.13,<2.0"
psycopg = { version = ">=3.2,<4.0", extras = ["binary"] }
pgvector = ">=0.3,<1.0"
pyyaml = ">=6.0,<7.0"
httpx = ">=0.27,<1.0"
beautifulsoup4 = ">=4.14,<5.0"
lxml = ">=5.0,<7.0"
python-docx = ">=1.2,<2.0"
pymupdf = ">=1.27,<2.0"
sentence-transformers = ">=5.1,<6.0"
torch = { version = "2.14.0+cu130", source = "pytorch-cu130" }

[tool.poetry.scripts]
regagent = "regagent.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10.0"
pytest-asyncio = ">=0.24,<1.0"
pytest-cov = ">=6.0,<8.0"
ruff = ">=0.9,<1.0"
mypy = ">=1.14,<2.0"
types-pyyaml = ">=6.0,<7.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
allowed-confusables = ["а", "б", "–", "—"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
